<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game </title>
    <link href="Simon.css" rel="stylesheet">
</head>
<body>
    <h1>Simon Game</h1>

    <h3>Press any key to start the game </h3>

    <div class="btn-container">
        <div class="line-one">
            <div class="btn one" id ="pink" type="button">1</div>
            <div class="btn two" id="yellow" type="button">2</div>
        </div>
        
        <div class="line-two">
            <div class="btn three" id="blue" type="button">3</div>
            <div class="btn four" id="darkblue" type="button">4</div>
        </div>
        
    </div>

    <button class="restart"> Restart </button>

    <script src="Simon.js"></script>
</body>
</html>
